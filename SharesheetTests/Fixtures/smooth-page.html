<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth scrolling page</title>
<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  div { height: 400px; }
  .r { background: #f00; }
  .g { background: #0f0; }
  .b { background: #00f; }
</style>
</head>
<body>
<div class="r"></div><div class="g"></div><div class="b"></div>
<div class="r"></div><div class="g"></div><div class="b"></div>
<div class="r"></div><div class="g"></div><div class="b"></div>
</body>
</html>
