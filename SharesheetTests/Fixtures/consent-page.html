<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consent page</title>
<style>
  html, body { margin: 0; padding: 0; }
  body.locked { overflow: hidden; }
  #content { height: 3000px; background: #0f0; display: flow-root; }
  #site-header { position: sticky; top: 0; height: 40px; background: #888; }
  #backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); }
  #cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; height: 300px; background: #f00; }
  #onetrust-banner { position: fixed; left: 0; right: 0; top: 0; height: 200px; background: #00f; }
</style>
</head>
<body>
<header id="site-header"><a href="#">Menu</a> <button>Search</button></header>
<div id="content">
  <p id="recipe">Our cookie recipe: accept no substitutes. <button>Print</button></p>
</div>
<div id="onetrust-consent-sdk"><div id="onetrust-banner">x</div></div>
<script>
  // Consent managers usually appear a moment after load and lock scrolling.
  setTimeout(function () {
    document.body.classList.add('locked');
    var backdrop = document.createElement('div');
    backdrop.id = 'backdrop';
    document.body.appendChild(backdrop);
    var banner = document.createElement('div');
    banner.id = 'cookie-banner';
    banner.innerHTML = '<h2>Wir schätzen Ihre Privatsphäre</h2>'
      + '<p>Wir verwenden Cookies, um Ihr Surferlebnis zu verbessern.</p>'
      + '<button>Alle akzeptieren</button><button>Alle ablehnen</button><button>Anpassen</button>';
    document.body.appendChild(banner);
    // Some consent managers draw inside a shadow root, out of reach of document queries.
    var host = document.createElement('div');
    host.id = 'shadow-consent';
    document.body.appendChild(host);
    host.attachShadow({ mode: 'open' }).innerHTML =
      '<div style="position: fixed; left: 0; right: 0; top: 300px; height: 200px; background: #ff0;">'
      + '<p>We use cookies.</p><button>Accept all</button></div>';
  }, 300);
</script>
</body>
</html>
