# Build (the repo may live on an exFAT volume: keep build products off it, skip codesign for simulator builds):
#   xcodegen generate
#   xcodebuild build -project Sharesheet.xcodeproj -scheme Sharesheet -destination 'platform=iOS Simulator,name=iPhone 17e' CODE_SIGNING_ALLOWED=NO
#   xcodebuild test  -project Sharesheet.xcodeproj -scheme Sharesheet -destination 'platform=iOS Simulator,name=iPhone 17e' CODE_SIGNING_ALLOWED=NO
#   swift test --package-path Packages/SharesheetKit --scratch-path ~/Library/Caches/SharesheetKit-build
name: Sharesheet
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # iPhone only; repeated on the targets, whose presets would set "1,2".
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: 5H6B8DE8HE
    # Identifiers follow the team, so signed builds get com.<TEAMID>.Sharesheet with their own App Group and
    # iCloud container. fastlane sets the team for distribution builds.
    SHARESHEET_APP_ID: com.$(DEVELOPMENT_TEAM).Sharesheet
    SHARESHEET_APP_GROUP: group.$(SHARESHEET_APP_ID)
    SHARESHEET_ICLOUD_CONTAINER: iCloud.$(SHARESHEET_APP_ID)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  SharesheetKit:
    path: Packages/SharesheetKit
targets:
  Sharesheet:
    type: application
    platform: iOS
    sources:
      - path: Sharesheet
      # The "+" dialog reuses the share sheet's form.
      - path: SharesheetShare/ShareFormModel.swift
      - path: SharesheetShare/ShareFormView.swift
      - path: SharesheetShare/SharedPayloadLoader.swift
      - path: SharesheetShare/LinkPreviewLoader.swift
      - path: SharesheetShare/Bounded.swift
    dependencies:
      - package: SharesheetKit
        product: SharesheetCore
      - package: SharesheetKit
        product: SharesheetUI
      - target: SharesheetShare
        embed: true
    entitlements:
      path: Sharesheet/Sharesheet.entitlements
      properties:
        com.apple.security.application-groups: [$(SHARESHEET_APP_GROUP)]
        com.apple.developer.icloud-container-identifiers: [$(SHARESHEET_ICLOUD_CONTAINER)]
        com.apple.developer.ubiquity-container-identifiers: [$(SHARESHEET_ICLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudDocuments]
    info:
      path: Sharesheet/Info.plist
      properties:
        CFBundleDisplayName: Sharesheet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSUbiquitousContainers:
          # Plist keys are not expanded like values; the preprocessor fills this one in (see INFOPLIST_PREPROCESS).
          SHARESHEET_ICLOUD_CONTAINER_KEY:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Sharesheet
            NSUbiquitousContainerSupportedFolderLevels: Any
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).capture]
        SharesheetAppGroup: $(SHARESHEET_APP_GROUP)
        SharesheetICloudContainer: $(SHARESHEET_ICLOUD_CONTAINER)
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHARESHEET_APP_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: SHARESHEET_ICLOUD_CONTAINER_KEY=$(SHARESHEET_ICLOUD_CONTAINER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SharesheetShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SharesheetShare
        excludes:
          - Preprocess.js
      - path: SharesheetShare/Preprocess.js
        buildPhase: resources
      - path: Sharesheet/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SharesheetKit
        product: SharesheetCore
      - package: SharesheetKit
        product: SharesheetUI
    entitlements:
      path: SharesheetShare/SharesheetShare.entitlements
      properties:
        com.apple.security.application-groups: [$(SHARESHEET_APP_GROUP)]
        com.apple.developer.icloud-container-identifiers: [$(SHARESHEET_ICLOUD_CONTAINER)]
        com.apple.developer.ubiquity-container-identifiers: [$(SHARESHEET_ICLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudDocuments]
    info:
      path: SharesheetShare/Info.plist
      properties:
        CFBundleDisplayName: Sharesheet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SharesheetAppGroup: $(SHARESHEET_APP_GROUP)
        SharesheetICloudContainer: $(SHARESHEET_ICLOUD_CONTAINER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: Preprocess
            NSExtensionActivationRule: |-
              SUBQUERY(extensionItems, $e, SUBQUERY($e.attachments, $a,
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" OR
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" OR
                ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHARESHEET_APP_ID).Share
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  SharesheetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SharesheetTests
        excludes:
          - Fixtures
      - path: SharesheetTests/Fixtures/long-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/busy-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/redirect-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/color-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/vh-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/smooth-page.html
        buildPhase: resources
      - path: SharesheetTests/Fixtures/dark-page.html
        buildPhase: resources
    dependencies:
      - target: Sharesheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHARESHEET_APP_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sharesheet.app/Sharesheet
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Sharesheet:
    build:
      targets:
        Sharesheet: all
        SharesheetShare: all
        SharesheetTests: [test]
    test:
      targets:
        - SharesheetTests
